name: Build plugins

on:
  push:
  workflow_dispatch:

# Version de Dark 4K: al subir (2.1 -> 2.2 -> 2.3 -> 2.4 -> 2.5) cambiar "2.5"/"2.5.0" en este archivo,
# en Dark4K/CMakeLists.txt y en el texto "v2.5" de Dark4K/Source/PluginEditor.cpp

jobs:
  build:
    name: ${{ matrix.project }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      PNAME: ${{ matrix.project == 'Dark4K' && format('Dark4K-v{0}', '2.5') || matrix.project }}
      PVER: ${{ matrix.project == 'Dark4K' && '2.5.0' || '1.0.0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows, project: BlueyComp, product: "Bluey Comp", slug: bluey-comp }
          - { os: macos-latest,   name: macOS,   project: BlueyComp, product: "Bluey Comp", slug: bluey-comp }
          - { os: windows-latest, name: Windows, project: DarkVCA,   product: "Dark VCA",   slug: dark-vca }
          - { os: macos-latest,   name: macOS,   project: DarkVCA,   product: "Dark VCA",   slug: dark-vca }
          - { os: windows-latest, name: Windows, project: DarkLimiter, product: "Dark Limiter", slug: dark-limiter }
          - { os: macos-latest,   name: macOS,   project: DarkLimiter, product: "Dark Limiter", slug: dark-limiter }
          - { os: windows-latest, name: Windows, project: DarkLevel, product: "Dark Level", slug: dark-level }
          - { os: macos-latest,   name: macOS,   project: DarkLevel, product: "Dark Level", slug: dark-level }
          - { os: windows-latest, name: Windows, project: Dark4K, product: "Dark 4K", slug: dark-4k }
          - { os: macos-latest,   name: macOS,   project: Dark4K, product: "Dark 4K", slug: dark-4k }
          - { os: windows-latest, name: Windows, project: DarkTransformer, product: "Dark Transformer", slug: dark-transformer }
          - { os: macos-latest,   name: macOS,   project: DarkTransformer, product: "Dark Transformer", slug: dark-transformer }

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S ${{ matrix.project }} -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign ad-hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - "build/${{ matrix.project }}_artefacts/Release/VST3/${{ matrix.product }}.vst3"
          codesign --force --deep -s - "build/${{ matrix.project }}_artefacts/Release/AU/${{ matrix.product }}.component"

      - name: Instalador macOS (.pkg)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          PLUGIN="build/${{ matrix.project }}_artefacts/Release/VST3/${{ matrix.product }}.vst3"
          AU="build/${{ matrix.project }}_artefacts/Release/AU/${{ matrix.product }}.component"
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components scripts installer
          cp -R "$PLUGIN" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "$AU" pkgroot/Library/Audio/Plug-Ins/Components/
          cat > scripts/postinstall <<'EOF'
          #!/bin/bash
          P="/Library/Audio/Plug-Ins/VST3/${{ matrix.product }}.vst3"
          xattr -cr "$P"
          codesign --force --deep -s - "$P" || true
          A="/Library/Audio/Plug-Ins/Components/${{ matrix.product }}.component"
          xattr -cr "$A"
          codesign --force --deep -s - "$A" || true
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          exit 0
          EOF
          chmod +x scripts/postinstall
          pkgbuild --root pkgroot --scripts scripts \
            --identifier com.darkshapestudios.${{ matrix.slug }} --version ${{ env.PVER }} \
            --install-location / installer/${{ env.PNAME }}-macOS-Installer.pkg

      - name: Instalador Windows (.exe)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppName=${{ matrix.product }}
          AppVersion=${{ env.PVER }}
          AppPublisher=Dark Shape Studios
          DefaultDirName={commoncf64}\VST3
          CreateAppDir=no
          Uninstallable=no
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=${{ env.PNAME }}-Windows-Installer
          Compression=lzma
          [Files]
          Source: "build\${{ matrix.project }}_artefacts\Release\VST3\${{ matrix.product }}.vst3\*"; DestDir: "{commoncf64}\VST3\${{ matrix.product }}.vst3"; Flags: recursesubdirs ignoreversion
          '@ | Set-Content -Path installer.iss -Encoding ASCII
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Payload para instalador combinado (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p payload/Library/Audio/Plug-Ins/VST3 payload/Library/Audio/Plug-Ins/Components
          cp -R "build/${{ matrix.project }}_artefacts/Release/VST3/${{ matrix.product }}.vst3" payload/Library/Audio/Plug-Ins/VST3/
          cp -R "build/${{ matrix.project }}_artefacts/Release/AU/${{ matrix.product }}.component" payload/Library/Audio/Plug-Ins/Components/
          tar -czf payload-${{ matrix.project }}-macOS.tgz -C payload .

      - name: Payload para instalador combinado (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Copy-Item -Recurse "build/${{ matrix.project }}_artefacts/Release/VST3/${{ matrix.product }}.vst3" payload/
          Compress-Archive -Path "payload/${{ matrix.product }}.vst3" -DestinationPath "payload-${{ matrix.project }}-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.project }}-${{ matrix.name }}
          path: payload-*
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PNAME }}-${{ matrix.name }}-Installer
          path: installer/*
          if-no-files-found: warn

  combined-mac:
    name: Instalador combinado (macOS)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*-macOS
          path: payloads
          merge-multiple: true
      - name: Armar .pkg con todos los plugins (VST3 + AU)
        run: |
          mkdir -p pkgroot scripts installer
          for f in payloads/payload-*-macOS.tgz; do tar -xzf "$f" -C pkgroot; done
          cat > scripts/postinstall <<'EOF'
          #!/bin/bash
          for N in "Bluey Comp" "Dark VCA" "Dark Limiter" "Dark Level" "Dark 4K" "Dark Transformer"; do
            for P in "/Library/Audio/Plug-Ins/VST3/$N.vst3" "/Library/Audio/Plug-Ins/Components/$N.component"; do
              [ -e "$P" ] || continue
              xattr -cr "$P"
              codesign --force --deep -s - "$P" || true
            done
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          exit 0
          EOF
          chmod +x scripts/postinstall
          pkgbuild --root pkgroot --scripts scripts \
            --identifier com.darkshapestudios.all-plugins --version 2.5.0 \
            --install-location / installer/DarkShape-Plugins-v2.5-macOS-Installer.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: DarkShape-Plugins-v2.5-macOS-Installer
          path: installer/*

  combined-win:
    name: Instalador combinado (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*-Windows
          path: payloads
          merge-multiple: true
      - name: Armar .exe con todos los plugins
        shell: pwsh
        run: |
          Get-ChildItem payloads -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath stage -Force }
          choco install innosetup -y --no-progress
          @'
          [Setup]
          AppName=Dark Shape Plugins
          AppVersion=2.5.0
          AppPublisher=Dark Shape Studios
          DefaultDirName={commoncf64}\VST3
          CreateAppDir=no
          Uninstallable=no
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=DarkShape-Plugins-v2.5-Windows-Installer
          Compression=lzma
          [Files]
          Source: "stage\*"; DestDir: "{commoncf64}\VST3"; Flags: recursesubdirs ignoreversion
          '@ | Set-Content -Path installer.iss -Encoding ASCII
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DarkShape-Plugins-v2.5-Windows-Installer
          path: installer/*

  # Al subir un tag (por ejemplo plugins-2026-11-25) se crea un Release de
  # GitHub con todos los instaladores: uno por plugin y los combinados.
  release:
    name: Publicar Release con los instaladores
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, combined-mac, combined-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-Installer"
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Dark Shape Plugins (${{ github.ref_name }})
          body: |
            Instaladores de los plugins de Dark Shape Studios.
            - macOS: archivos .pkg (VST3 + AU)
            - Windows: archivos .exe (VST3)
            - DarkShape-Plugins: instalador combinado con todos los plugins
          files: dist/*
